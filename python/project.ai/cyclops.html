<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cyclops: Face Controller</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        
        #video-container {
            position: absolute; bottom: 20px; right: 20px;
            width: 160px; height: 120px;
            border: 2px solid #ff0055; opacity: 0.6;
            transform: scaleX(-1); z-index: 10;
        }

        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
        }

        #score-board {
            position: absolute; top: 20px; left: 20px;
            color: #ff0055; font-size: 1.5rem; font-weight: bold;
            text-shadow: 0 0 10px #ff0000;
        }

        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 40px; height: 40px;
            border: 2px solid #00ffcc; border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #00ffcc;
            transition: transform 0.05s;
        }
        .dot {
            position: absolute; top: 50%; left: 50%;
            width: 4px; height: 4px; background: #fff;
            transform: translate(-50%, -50%);
        }

        .laser-beam {
            position: absolute; top: 50%; left: 50%;
            width: 0px; height: 0px;
            border-left: 2px solid transparent;
            border-right: 2px solid transparent;
            border-bottom: 1000px solid rgba(255, 0, 85, 0.8);
            transform-origin: top center;
            opacity: 0;
            transition: opacity 0.1s;
        }
    </style>
</head>
<body>

    <div id="score-board">
        SCORE: <span id="score">0</span><br>
        <span style="font-size: 0.8rem; color: #fff;">AIM: Head | FIRE: Open Mouth</span>
    </div>

    <div id="hud">
        <div id="crosshair"><div class="dot"></div></div>
    </div>

    <div id="video-container">
        <video id="input_video" playsinline></video>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

    <script>
        // --- 1. THREE.JS SETUP (THE GAME WORLD) ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 10;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(0, 0, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // --- 2. GAME OBJECTS (ASTEROIDS) ---
        const enemies = [];
        const enemyGeo = new THREE.IcosahedronGeometry(1, 0);
        
        function spawnEnemy() {
            const mat = new THREE.MeshStandardMaterial({ 
                color: Math.random() * 0xffffff, 
                roughness: 0.4, 
                emissive: 0x222222,
                flatShading: true
            });
            const mesh = new THREE.Mesh(enemyGeo, mat);
            
            // Spawn random position in distance
            mesh.position.x = (Math.random() - 0.5) * 30;
            mesh.position.y = (Math.random() - 0.5) * 20;
            mesh.position.z = -50; // Far away

            scene.add(mesh);
            enemies.push({ mesh: mesh, active: true });
        }

        // --- 3. LASER LOGIC ---
        // A simple red line in 3D space
        const laserGeo = new THREE.CylinderGeometry(0.1, 0.1, 100, 8);
        laserGeo.rotateX(-Math.PI / 2); // Point forward
        const laserMat = new THREE.MeshBasicMaterial({ color: 0xff0055, transparent: true, opacity: 0 });
        const laserMesh = new THREE.Mesh(laserGeo, laserMat);
        scene.add(laserMesh);

        // --- 4. GAME STATE ---
        let score = 0;
        let aimX = 0, aimY = 0;
        let isFiring = false;
        let cooldown = 0;

        // --- 5. MEDIAPIPE LOGIC ---
        const videoElement = document.getElementById('input_video');
        const crosshair = document.getElementById('crosshair');

        function onResults(results) {
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const face = results.multiFaceLandmarks[0];

                // 1. AIMING (Head Rotation)
                // We use nose tip (1) vs center of head to determine rotation roughly
                const nose = face[1];
                
                // Map coordinates (0-1) to screen space (-1 to 1)
                // Invert X for mirror feel
                aimX = (0.5 - nose.x) * 30; // 30 is aiming sensitivity
                aimY = (0.5 - nose.y) * 20;

                // Move HTML Crosshair
                const screenX = (0.5 - nose.x) * window.innerWidth * 2 + window.innerWidth/2; // Rough mapping
                const screenY = nose.y * window.innerHeight;
                
                // Better UI mapping:
                // Let's just map the raw aims to % 
                const cx = 50 + ((0.5 - nose.x) * 150); // Amplify movement
                const cy = 50 + ((nose.y - 0.5) * 150);
                crosshair.style.left = `${cx}%`;
                crosshair.style.top = `${cy}%`;

                // 2. FIRING (Mouth Open)
                // Measure distance between upper lip (13) and lower lip (14)
                const upperLip = face[13];
                const lowerLip = face[14];
                const mouthDist = Math.hypot(upperLip.x - lowerLip.x, upperLip.y - lowerLip.y);

                if (mouthDist > 0.05) { // Threshold for "Open"
                    if(!isFiring && cooldown <= 0) {
                        fireLaser();
                    }
                } else {
                    isFiring = false;
                }
            }
        }

        function fireLaser() {
            isFiring = true;
            cooldown = 10; // Frames
            
            // Visuals
            laserMesh.material.opacity = 1;
            laserMesh.position.set(aimX, aimY, 8); // Start from "eye" position
            laserMesh.lookAt(aimX * 2, aimY * 2, -100); // Shoot into depth
            
            // Raycast / Hit Detection
            // Simple distance check logic
            enemies.forEach(e => {
                if(!e.active) return;
                
                // Check if aiming near enemy
                // (This is "Arcade" physics, generous hitboxes)
                const dx = Math.abs(e.mesh.position.x - aimX);
                const dy = Math.abs(e.mesh.position.y - aimY);
                
                // Objects get bigger as they get closer, so aim depends on Z
                // We simplify: if aiming roughly at it
                if (dx < 3 && dy < 3) {
                    // HIT!
                    destroyEnemy(e);
                }
            });
        }

        function destroyEnemy(e) {
            e.active = false;
            e.mesh.visible = false;
            score += 100;
            document.getElementById('score').innerText = score;
            
            // Explosion particles (Simulated by expanding wireframe)
            const boom = new THREE.Mesh(enemyGeo, new THREE.MeshBasicMaterial({color: 0xff0055, wireframe:true}));
            boom.position.copy(e.mesh.position);
            scene.add(boom);
            
            // Animate boom
            let scale = 1;
            const interval = setInterval(() => {
                scale += 0.2;
                boom.scale.set(scale, scale, scale);
                boom.material.opacity -= 0.1;
                if(scale > 3) {
                    clearInterval(interval);
                    scene.remove(boom);
                }
            }, 30);
        }

        const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
        faceMesh.setOptions({ maxNumFaces: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        faceMesh.onResults(onResults);

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => { await faceMesh.send({image: videoElement}); },
            width: 320, height: 240
        });
        cameraUtils.start();

        // --- 6. GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // Laser fade
            if(laserMesh.material.opacity > 0) {
                laserMesh.material.opacity -= 0.1;
            }
            if(cooldown > 0) cooldown--;

            // Move Enemies
            enemies.forEach(e => {
                if(!e.active) return;
                
                e.mesh.position.z += 0.2 + (score * 0.001); // Get faster over time
                e.mesh.rotation.x += 0.01;
                e.mesh.rotation.y += 0.02;

                // Game Over / Miss
                if(e.mesh.position.z > 10) {
                    e.active = false;
                    e.mesh.visible = false;
                    // Flash screen red
                    document.body.style.background = '#500';
                    setTimeout(() => document.body.style.background = '#000', 100);
                    score -= 50;
                    document.getElementById('score').innerText = score;
                }
            });

            // Clean up inactive enemies
            // (In real game, we'd object pool, but this is fine for demo)

            // Spawn new enemies
            if (Math.random() < 0.02) spawnEnemy();

            renderer.render(scene, camera);
        }

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
</body>
</html>
